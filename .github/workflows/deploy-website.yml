name: Deploy Website to Vercel

on:
  workflow_call:
    inputs:
      published_commit:
        description: Commit whose packages the successful release job published
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - 'packages/website/**'
      - 'packages/foldkit/**'
      - 'packages/ui/**'
      - 'packages/devtools/**'
      - 'packages/markdown/**'
      - 'packages/vite-plugin-foldkit/**'
      - 'examples/**'
      - 'scripts/build-examples.ts'
      - 'scripts/check-playground-ssg-build.ts'
      - 'scripts/check-published-versions.ts'
      - 'scripts/example-bridge.js'
      - 'scripts/plan-website-deploy.mjs'
      - 'scripts/restore-website-fonts.sh'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-website.yml'

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize package inputs
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.authorization.outputs.deploy }}
      target: ${{ steps.authorization.outputs.target }}

    steps:
      - name: Checkout code and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Match package source to published versions
        id: authorization
        env:
          PUBLISHED_COMMIT: ${{ inputs.published_commit }}
        run: |
          target=$(git rev-parse HEAD)
          if [ -n "${PUBLISHED_COMMIT}" ]; then
            if ! git merge-base --is-ancestor "${PUBLISHED_COMMIT}" "${target}"; then
              echo "the published commit ${PUBLISHED_COMMIT} is not an ancestor of latest main ${target}" >&2
              exit 1
            fi
          fi

          result=$(node scripts/plan-website-deploy.mjs "${target}")
          echo "${result}"
          deploy=${result#deploy=}

          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter website... --filter '{examples/**}...'

      # NOTE: A playground installs these from npm in a visitor's browser. The
      # registry may need a short propagation window after Changesets returns,
      # so this checks the actual artifacts and normal npm peer resolution with
      # bounded retries before building anything that can reach production.
      - name: Verify the playground versions and peer ranges are published
        run: pnpm check:published-versions -- --wait

      - name: Build the exact transformed SSG playground
        run: pnpm check:playground-ssg-build

      - name: Build core packages
        run: pnpm --filter 'website^...' build

      - name: Build examples
        run: pnpm build:examples

      - name: Restore licensed website fonts
        run: bash scripts/restore-website-fonts.sh
        env:
          ABC_FAVORIT_BOOK_WOFF2_BASE64: ${{ secrets.ABC_FAVORIT_BOOK_WOFF2_BASE64 }}
          ABC_FAVORIT_LIGHT_WOFF2_BASE64: ${{ secrets.ABC_FAVORIT_LIGHT_WOFF2_BASE64 }}

      - name: Resolve GitHub star count
        id: github-stars
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(curl -sfL --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${GH_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: foldkit-website-build" \
            https://api.github.com/repos/foldkit/foldkit \
            | jq -r '.stargazers_count // empty') || count=""
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Build website
        run: pnpm --filter website build
        env:
          FOLDKIT_GITHUB_STAR_COUNT: ${{ steps.github-stars.outputs.count }}

      - name: Install Playwright chromium
        run: pnpm --filter website exec playwright install --with-deps chromium

      - name: Prerender
        run: pnpm --filter website prerender
        env:
          FOLDKIT_GITHUB_STAR_COUNT: ${{ steps.github-stars.outputs.count }}

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r packages/website/dist/* .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/og/(.*)\\.png$",
                "headers": {
                  "Content-Type": "image/png",
                  "Cache-Control": "public, max-age=3600, stale-while-revalidate=86400"
                },
                "continue": true
              },
              {
                "src": "^/$",
                "headers": {
                  "Link": "</sitemap.xml>; rel=\"sitemap\", </get-started/manifesto>; rel=\"about\", </get-started/getting-started>; rel=\"help\", </example-apps>; rel=\"related\", </ai/overview>; rel=\"describedby\""
                },
                "continue": true
              },
              {
                "src": "^/playground/.*",
                "headers": {
                  "Cross-Origin-Embedder-Policy": "credentialless",
                  "Cross-Origin-Opener-Policy": "same-origin"
                },
                "continue": true
              },
              {
                "src": ".*",
                "headers": {
                  "Cross-Origin-Resource-Policy": "same-origin"
                },
                "continue": true
              },
              {
                "src": "^/assets/(.*)",
                "headers": {
                  "Cache-Control": "public, max-age=31536000, immutable"
                },
                "continue": true
              },
              {
                "src": "^/([^.]*)$",
                "headers": {
                  "Cache-Control": "public, max-age=0, must-revalidate"
                },
                "continue": true
              },
              { "src": "^/manifesto$", "status": 308, "headers": { "Location": "/get-started/manifesto" } },
              { "src": "^/manifesto\\.md$", "status": 308, "headers": { "Location": "/get-started/manifesto.md" } },
              { "src": "^/getting-started$", "status": 308, "headers": { "Location": "/get-started/getting-started" } },
              { "src": "^/getting-started\\.md$", "status": 308, "headers": { "Location": "/get-started/getting-started.md" } },
              { "src": "^/why-no-jsx$", "status": 308, "headers": { "Location": "/faq/why-no-jsx" } },
              { "src": "^/why-no-jsx\\.md$", "status": 308, "headers": { "Location": "/faq/why-no-jsx.md" } },
              { "src": "^/what-about-ssr$", "status": 308, "headers": { "Location": "/core/server-rendering" } },
              { "src": "^/what-about-ssr\\.md$", "status": 308, "headers": { "Location": "/core/server-rendering.md" } },
              { "src": "^/faq/what-about-ssr$", "status": 308, "headers": { "Location": "/core/server-rendering" } },
              { "src": "^/faq/what-about-ssr\\.md$", "status": 308, "headers": { "Location": "/core/server-rendering.md" } },
              { "src": "^/coming-from-react$", "status": 308, "headers": { "Location": "/react/coming-from-react" } },
              { "src": "^/coming-from-react\\.md$", "status": 308, "headers": { "Location": "/react/coming-from-react.md" } },
              { "src": "^/foldkit-vs-react-side-by-side$", "status": 308, "headers": { "Location": "/react/foldkit-vs-react-side-by-side" } },
              { "src": "^/foldkit-vs-react-side-by-side\\.md$", "status": 308, "headers": { "Location": "/react/foldkit-vs-react-side-by-side.md" } },
              { "src": "^/routing-and-navigation$", "status": 308, "headers": { "Location": "/core/routing-and-navigation" } },
              { "src": "^/routing-and-navigation\\.md$", "status": 308, "headers": { "Location": "/core/routing-and-navigation.md" } },
              { "src": "^/field-validation$", "status": 308, "headers": { "Location": "/core/field-validation" } },
              { "src": "^/field-validation\\.md$", "status": 308, "headers": { "Location": "/core/field-validation.md" } },
              { "src": "^/project-organization$", "status": 308, "headers": { "Location": "/patterns/project-organization" } },
              { "src": "^/project-organization\\.md$", "status": 308, "headers": { "Location": "/patterns/project-organization.md" } },
              { "src": "^/example-apps/upload$", "status": 308, "headers": { "Location": "/example-apps/interrupting-commands" } },
              { "src": "^/playground/upload$", "status": 308, "headers": { "Location": "/playground/interrupting-commands" } },
              { "src": "^/example-apps/checkout-machine$", "status": 308, "headers": { "Location": "/example-apps/state-machine" } },
              { "src": "^/example-apps/checkout-machine\\.md$", "status": 308, "headers": { "Location": "/example-apps/state-machine.md" } },
              { "src": "^/playground/checkout-machine$", "status": 308, "headers": { "Location": "/playground/state-machine" } },
              { "src": "^/blog/foldkit-has-server-rendering-now$", "status": 308, "headers": { "Location": "/blog/foldkit-has-server-rendering" } },
              { "src": "^/blog/foldkit-has-server-rendering-now\\.md$", "status": 308, "headers": { "Location": "/blog/foldkit-has-server-rendering.md" } },
              { "handle": "filesystem" },
              {
                "src": "/",
                "has": [{ "type": "query", "key": "embedded", "value": "(?<slug>[^&]+)" }],
                "dest": "/example-apps-embed/$slug/index.html"
              },
              { "src": "/playground/(.*)", "dest": "/playground/index.html" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        run: pnpm dlx vercel@55.0.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}

      - name: Wait for the deployed website build
        run: |
          response_file="${RUNNER_TEMP}/foldkit-release-smoke.html"
          for attempt in $(seq 1 30); do
            if curl -fsSL \
              -H 'Cache-Control: no-cache' \
              "https://foldkit.dev/playground/ssr?release-smoke=${GITHUB_RUN_ID}-${attempt}" \
              -o "${response_file}"; then
              if grep -Fq "data-foldkit-build=\"${{ needs.authorize.outputs.target }}\"" "${response_file}"; then
                echo "foldkit.dev is serving build ${{ needs.authorize.outputs.target }}"
                exit 0
              fi
            fi
            echo "foldkit.dev has not reached build ${GITHUB_SHA}; waiting"
            sleep 5
          done
          echo "foldkit.dev did not reach build ${{ needs.authorize.outputs.target }}" >&2
          exit 1

      - name: Smoke the deployed SSR and SSG playgrounds
        run: pnpm --filter website exec playwright test
        env:
          FOLDKIT_LIVE_WEBSITE_URL: https://foldkit.dev
