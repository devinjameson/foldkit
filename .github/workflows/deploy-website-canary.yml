name: Deploy Website Canary

on:
  push:
    branches:
      - main
    paths:
      - 'packages/website/**'
      - 'packages/foldkit/**'
      - 'packages/ui/**'
      - 'packages/devtools/**'
      - 'packages/markdown/**'
      - 'packages/vite-plugin-foldkit/**'
      - 'examples/**'
      - 'scripts/build-examples.ts'
      - 'scripts/check-playground-ssg-build.ts'
      - 'scripts/example-bridge.js'
      - 'scripts/restore-website-fonts.sh'
      - 'scripts/website-vercel-config.mjs'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-website-build.yml'
      - '.github/workflows/deploy-website-canary.yml'

concurrency:
  group: deploy-website-canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-website-build.yml
    with:
      target: ${{ github.sha }}
      channel: canary
      hostname: canary.foldkit.dev
    secrets:
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_WEBSITE_CANARY_PROJECT_ID }}
      website_book_font: ${{ secrets.ABC_FAVORIT_BOOK_WOFF2_BASE64 }}
      website_light_font: ${{ secrets.ABC_FAVORIT_LIGHT_WOFF2_BASE64 }}
