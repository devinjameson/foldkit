name: Release

on:
  workflow_dispatch:
    inputs:
      published_commit:
        description: Stable release commit whose npm latest tags were promoted
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/check-changeset-ignore.mjs'
      - 'scripts/check-create-foldkit-app-smoke.ts'
      - 'scripts/check-peer-floors.ts'
      - 'scripts/build-public-packages.mjs'
      - 'scripts/coherent-release.mjs'
      - 'scripts/lib/coherent-release.mjs'
      - 'scripts/lib/workspace-packages.mjs'
      - 'scripts/reset-peer-deps.ts'
      - '.github/workflows/release.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or upload stable packages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          NPM_DIR="$(npm config get prefix)/lib/node_modules/npm"
          rm -rf "$NPM_DIR"
          curl -sL https://registry.npmjs.org/npm/-/npm-11.12.1.tgz | tar xz -C "$(dirname "$NPM_DIR")"
          mv "$(dirname "$NPM_DIR")/package" "$NPM_DIR"
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changeset ignore list
        run: pnpm check:changeset-ignore

      - name: Smoke test create-foldkit-app
        run: pnpm check:create-foldkit-app-smoke

      - name: Create Release Pull Request or upload and verify packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          SKIP_SIMPLE_GIT_HOOKS: '1'

  canary:
    name: Upload and verify commit-addressed package canary
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          NPM_DIR="$(npm config get prefix)/lib/node_modules/npm"
          rm -rf "$NPM_DIR"
          curl -sL https://registry.npmjs.org/npm/-/npm-11.12.1.tgz | tar xz -C "$(dirname "$NPM_DIR")"
          mv "$(dirname "$NPM_DIR")/package" "$NPM_DIR"
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload and verify the canary snapshot
        run: pnpm release:canary
        env:
          NPM_CONFIG_PROVENANCE: true
          SKIP_SIMPLE_GIT_HOOKS: '1'

  finalize:
    name: Verify stable promotion
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the promoted release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.published_commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify every stable package and latest tag
        run: pnpm release:verify-latest

  deploy-website:
    name: Deploy the promoted website
    needs: finalize
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-website.yml
    with:
      published_commit: ${{ inputs.published_commit }}
    secrets: inherit
